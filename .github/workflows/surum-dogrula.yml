name: Sürüm bildirimi denetimi

on:
  push:
    branches: [main]
    paths: ["surum.json"]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: surum.json alanlarını ve indirme bağlantısını denetle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          veri = json.load(open("surum.json", encoding="utf-8"))
          hata = []

          for alan in ("surum", "indirme", "sha256", "boyut"):
              if not veri.get(alan):
                  hata.append(f"'{alan}' alanı boş.")

          surum = str(veri.get("surum", ""))
          if not all(p.isdigit() for p in surum.split(".") if p != ""):
              hata.append(f"Sürüm sayısal olmalı: {surum!r}")
          if len(str(veri.get("sha256", ""))) != 64:
              hata.append("sha256 64 karakter olmalı.")
          if f"/v{surum}/" not in str(veri.get("indirme", "")):
              hata.append("indirme bağlantısı sürüm etiketiyle uyuşmuyor.")

          def basliklar(url):
              istek = urllib.request.Request(url, method="GET")
              istek.add_header("User-Agent", "gps2026-surum-denetim")
              istek.add_header("Range", "bytes=0-0")
              with urllib.request.urlopen(istek, timeout=30) as y:
                  return y.status, y.headers, y.geturl()

          for etiket, url, boyut in (
              ("kurulum", veri.get("indirme"), veri.get("boyut")),
              ("başlatıcı",
               (veri.get("baslatici") or {}).get("indirme"),
               (veri.get("baslatici") or {}).get("boyut")),
          ):
              if not url:
                  continue
              try:
                  durum, bas, son = basliklar(url)
              except Exception as e:
                  hata.append(f"{etiket}: bağlantı açılamadı ({e})")
                  continue
              aralik = bas.get("Content-Range", "")
              gercek = int(aralik.split("/")[-1]) if "/" in aralik else None
              if gercek is not None and boyut and gercek != int(boyut):
                  hata.append(
                      f"{etiket}: boyut uyuşmuyor (bildirilen {boyut}, gerçek {gercek})"
                  )
              print(f"{etiket}: HTTP {durum}, boyut {gercek}")

          # --- ozet dogrulamasi -------------------------------------------
          # Boyut ayni olup icerik farkli olabiliyor; bu tam olarak daha once
          # yasanan hata sinifi. Manifestteki sha256 ile Release varliginin
          # kendi digest'i karsilastirilir (indirme gerekmez).
          def api(yol):
              r = urllib.request.Request(f"https://api.github.com{yol}")
              r.add_header("Accept", "application/vnd.github+json")
              r.add_header("User-Agent", "gps2026-surum-denetim")
              jeton = os.environ.get("GITHUB_TOKEN")
              if jeton:
                  r.add_header("Authorization", f"Bearer {jeton}")
              try:
                  with urllib.request.urlopen(r, timeout=60) as y:
                      return json.load(y)
              except urllib.error.HTTPError as e:
                  print(f"  API {e.code} {yol}")
                  return None

          depo = os.environ.get("GITHUB_REPOSITORY", "")
          beklenen = [
              ("kurulum", f"v{surum}", "gps2026turkceyama.exe",
               veri.get("sha256")),
              ("başlatıcı", f"v{surum}", "GPS2026Baslat.exe",
               (veri.get("baslatici") or {}).get("sha256")),
              ("dublaj", "dublaj", "gps2026dublaj.dat",
               (veri.get("dublaj") or {}).get("sha256")),
          ]
          for etiket, tag, dosya, bildirilen in beklenen:
              if not bildirilen:
                  continue
              yayin = api(f"/repos/{depo}/releases/tags/{tag}")
              if yayin is None:
                  hata.append(f"{etiket}: '{tag}' Release'i bulunamadı.")
                  continue
              varlik = next((a for a in yayin.get("assets", [])
                             if a["name"] == dosya), None)
              if varlik is None:
                  hata.append(f"{etiket}: '{tag}' içinde {dosya} yok.")
                  continue
              gercek_ozet = (varlik.get("digest") or "").replace("sha256:", "")
              if not gercek_ozet:
                  print(f"{etiket}: varlık özeti API'de yok, atlandı.")
                  continue
              if gercek_ozet.lower() != str(bildirilen).lower():
                  hata.append(
                      f"{etiket}: ÖZET UYUŞMUYOR — manifest {bildirilen[:16]}…, "
                      f"yayımlanan dosya {gercek_ozet[:16]}…  "
                      "Bu hâliyle kurulum ve başlatıcı indirmeyi reddeder.")
              else:
                  print(f"{etiket}: özet doğrulandı ({gercek_ozet[:16]}…)")

          if hata:
              print("\n".join("HATA: " + h for h in hata))
              sys.exit(1)
          print("surum.json doğrulandı.")
          PY
