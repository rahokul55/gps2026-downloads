name: Medya dizini

on:
  push:
    branches: [main]
    paths:
      - "medya/gorsel/**"
      - "medya/video/**"
      - "medya/basliklar.json"
      - ".github/scripts/medya_index.py"
      - ".github/workflows/medya-index.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

concurrency:
  group: medya-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dizin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araçları kur
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true

      - name: Dizini üret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/medya_index.py

      - name: Değişikliği gönder
        run: |
          if [ -z "$(git status --porcelain medya)" ]; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medya
          git commit -m "Medya dizini güncellendi [skip ci]"
          git push
